<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo — Pastelería Mishky</title>
  <meta
    name="description"
    content="Tortas, postres peruanos, panes y galletas artesanales de Pastelería Mishky."
  />
  <link rel="icon" href="img/favicon.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Nunito:wght@400;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
  <header class="cabecera">
    <div class="contenedor cabecera__fila">
      <a href="catalogo.html" class="marca">
        <img src="img/logo.png" alt="Pastelería Mishky" width="176" height="52" />
      </a>
      <nav aria-label="Principal">
        <ul class="menu">
          <li><a href="#catalogo" aria-current="page">Catálogo</a></li>
          <li><a href="#contacto">Contacto</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="hero">
    <div class="contenedor hero__texto">
      <p class="hero__antetitulo">Hecho a mano en Cusco desde 2012</p>
      <h1>Dulces que se recuerdan</h1>
      <p>Tortas, postres peruanos, panes y galletas horneados cada mañana.</p>
    </div>
  </section>

  <main id="catalogo" class="contenedor">
    <h2 class="titulo-seccion">Nuestro catálogo</h2>

    <!-- RETOS: un solo contenedor de controles para la delegación de eventos -->
    <div id="controles">
      <div id="filtros" class="filtros" role="group" aria-label="Filtrar por categoría"></div>
      <div class="herramientas">
        <label for="buscador">Buscar por nombre</label>
        <input type="search" id="buscador" placeholder="Ej.: torta" autocomplete="off" />

        <label for="orden">Ordenar por</label>
        <select id="orden">
          <option value="">Sin orden</option>
          <option value="precio-asc">Menor precio</option>
          <option value="precio-desc">Mayor precio</option>
          <option value="nombre">Nombre A-Z</option>
        </select>

        <label class="disp"><input type="checkbox" id="solo-disponibles" /> Solo disponibles</label>
      </div>
    </div>

    <p id="estado" class="estado" role="status" aria-live="polite"></p>
    <p id="aviso" class="aviso" hidden></p>
    <ul id="grilla" class="grilla" aria-busy="true"></ul>
  </main>

  <footer id="contacto" class="pie">
    <div class="contenedor">
      <strong>Pastelería Mishky</strong>
      <p>Av. El Sol 845, Cusco · Pedidos: 984 000 111</p>
      <p>&copy; 2026 · Proyecto académico · Desarrollo Web I</p>
    </div>
  </footer>

  <!-- Plantilla de una tarjeta de producto -->
  <template id="tpl-producto">
    <li class="tarjeta">
      <figure class="tarjeta__foto">
        <img width="600" height="600" loading="lazy" alt="" />
        <span class="etiqueta" hidden></span>
      </figure>
      <div class="tarjeta__cuerpo">
        <p class="tarjeta__categoria"></p>
        <h3 class="tarjeta__nombre"></h3>
        <p class="tarjeta__descripcion"></p>
        <div class="tarjeta__pie">
          <span class="tarjeta__precio"></span>
          <span class="tarjeta__porciones"></span>
        </div>
      </div>
    </li>
  </template>

  <!-- Reto 8: Modal nativo de detalle -->
  <dialog id="detalle" class="detalle" aria-labelledby="detalle-titulo">
    <img id="detalle-img" alt="" width="900" height="900" />
    <div class="detalle__cuerpo">
      <p id="detalle-categoria" class="tarjeta__categoria"></p>
      <h2 id="detalle-titulo"></h2>
      <p id="detalle-descripcion"></p>
      <div class="detalle__datos">
        <span id="detalle-precio" class="detalle__precio"></span>
        <span id="detalle-stock"></span>
      </div>
      <button type="button" class="detalle__cerrar" data-cerrar>Cerrar</button>
    </div>
  </dialog>

  <script src="js/catalogo.js" defer></script>
</body>
</html>
